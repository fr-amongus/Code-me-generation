openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generation
    description: AI application generation operations
  - name: projects
    description: Saved project workspace operations
  - name: chat
    description: Project improvement conversations
  - name: auth
    description: Code Me account and session operations
  - name: admin
    description: Owner-only administration and feature release controls
  - name: autocode
    description: Isolated platform improvement proposals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateApplication
      tags: [generation]
      summary: Generate a standalone web application
      description: Generates a complete HTML/CSS/JavaScript application from a natural language description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateApplicationInput"
      responses:
        "200":
          description: Generated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApplication"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current signed-in account
      responses:
        "200":
          description: Current account or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a Code Me account with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [auth]
      summary: Sign in with a Code Me username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid login input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Username or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Sign out of a Code Me account
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogout"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Get owner access and bootstrap availability
      responses:
        "200":
          description: Admin access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/bootstrap/claim:
    post:
      operationId: claimOwnerAdmin
      tags: [admin]
      summary: Claim the one-time owner administrator role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBootstrapInput"
      responses:
        "200":
          description: Owner role claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
        "400":
          description: Invalid bootstrap request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required or token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Owner role already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: View account list and recorded AI usage
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: Users and privacy-safe AI usage totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/features:
    get:
      operationId: listAdminFeatures
      tags: [admin]
      summary: List feature release states
      responses:
        "200":
          description: Feature audience settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureReleaseList"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/features/{key}:
    patch:
      operationId: updateAdminFeature
      tags: [admin]
      summary: Release a feature to all accounts or admins only
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureReleaseInput"
      responses:
        "200":
          description: Updated feature audience
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureRelease"
        "400":
          description: Invalid audience or feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /features:
    get:
      operationId: listAvailableFeatures
      tags: [admin]
      summary: List features available to the current visitor
      responses:
        "200":
          description: Public feature access flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureAccessList"
  /autocode/uploads/request-url:
    post:
      operationId: requestAutoCodeUploadUrl
      tags: [autocode]
      summary: Request a private Auto-code attachment upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCodeUploadInput"
      responses:
        "200":
          description: Private upload location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeUploadUrl"
        "400":
          description: Invalid or unsupported attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /autocode/proposals:
    get:
      operationId: listAutoCodeProposals
      tags: [autocode]
      summary: List proposals created by the current account
      responses:
        "200":
          description: The account's proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeProposalList"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAutoCodeProposal
      tags: [autocode]
      summary: Create a staged platform improvement proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCodeProposalInput"
      responses:
        "201":
          description: Draft proposal and AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeProposalDetail"
        "400":
          description: Invalid prompt or attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many AI requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /autocode/proposals/{id}:
    get:
      operationId: getAutoCodeProposal
      tags: [autocode]
      summary: View one proposal owned by the current account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal conversation and versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeProposalDetail"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /autocode/proposals/{id}/messages:
    post:
      operationId: sendAutoCodeProposalMessage
      tags: [autocode]
      summary: Refine a draft proposal with another chat message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCodeProposalInput"
      responses:
        "200":
          description: Updated proposal draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeProposalDetail"
        "400":
          description: Invalid prompt or attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Proposal is locked for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many AI requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /autocode/proposals/{id}/submit:
    post:
      operationId: submitAutoCodeProposal
      tags: [autocode]
      summary: Send a proposal draft to the owner for review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeProposalSummary"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Proposal has no generated version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/autocode/proposals:
    get:
      operationId: listAdminAutoCodeProposals
      tags: [admin, autocode]
      summary: List all platform improvement proposals
      responses:
        "200":
          description: Proposals available to the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeAdminProposalList"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/autocode/proposals/{id}:
    get:
      operationId: getAdminAutoCodeProposal
      tags: [admin, autocode]
      summary: Inspect a proposal's notes and complete source tree
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Proposal detail for owner review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeAdminProposalDetail"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/autocode/proposal-file:
    post:
      operationId: readAdminAutoCodeProposalFile
      tags: [admin, autocode]
      summary: Read one file from the isolated proposal snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCodeFileInput"
      responses:
        "200":
          description: File contents and original version when changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeFileContent"
        "404":
          description: Proposal file not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Owner administrator required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/autocode/proposals/{id}/review:
    post:
      operationId: reviewAdminAutoCodeProposal
      tags: [admin, autocode]
      summary: Approve, reject, or mark a proposal applied in Replit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCodeReviewInput"
      responses:
        "200":
          description: Review decision saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCodeReviewResult"
        "400":
          description: Invalid review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Proposal is not in a reviewable state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List saved projects for a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: Invalid workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a saved project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a saved project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a saved project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkspaceInput"
      responses:
        "204":
          description: Project deleted
        "400":
          description: Invalid workspace or project id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/messages:
    get:
      operationId: listProjectMessages
      tags: [chat]
      summary: List the saved messages for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Project conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMessage"
        "400":
          description: Invalid project or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/memory:
    get:
      operationId: listProjectMemoryFiles
      tags: [projects]
      summary: List the persistent memory files for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Project memory files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMemoryFile"
        "400":
          description: Invalid project or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/chat:
    post:
      operationId: sendProjectMessage
      tags: [chat]
      summary: Create or improve a project through its saved chat
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectChatInput"
      responses:
        "200":
          description: Saved chat turn, updated project, and optional pending interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChatResult"
        "400":
          description: Invalid project message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Chat generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/interaction:
    get:
      operationId: getPendingProjectInteraction
      tags: [chat]
      summary: Get the pending question or secret request for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Pending interaction, or null when there is none
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingProjectInteractionResult"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/interactions/{interactionId}/respond:
    post:
      operationId: respondToProjectInteraction
      tags: [chat]
      summary: Answer a pending project interaction and resume its chat
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
        - name: interactionId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInteractionResponseInput"
      responses:
        "200":
          description: Resumed chat turn, updated project, and optional next interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChatResult"
        "400":
          description: Invalid or incomplete answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project or pending interaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The interaction is already being handled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/interactions/{interactionId}/cancel:
    post:
      operationId: cancelProjectInteraction
      tags: [chat]
      summary: Cancel a pending project interaction without continuing the AI turn
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
        - name: interactionId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInteractionCancelInput"
      responses:
        "200":
          description: Cancelled interaction and conversation message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelProjectInteractionResult"
        "404":
          description: Project or pending interaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/secrets:
    get:
      operationId: listProjectSecrets
      tags: [secrets]
      summary: List masked secret metadata for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Secret metadata without secret values
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSecret"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProjectSecret
      tags: [secrets]
      summary: Create a project secret
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSecretInput"
      responses:
        "201":
          description: Created secret metadata without the secret value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecret"
        "400":
          description: Invalid secret name or value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A secret with this name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/secrets/{secretId}:
    patch:
      operationId: updateProjectSecret
      tags: [secrets]
      summary: Rename or replace a project secret
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
        - name: secretId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectSecretUpdate"
      responses:
        "200":
          description: Updated secret metadata without the secret value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecret"
        "400":
          description: Invalid secret update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project or secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProjectSecret
      tags: [secrets]
      summary: Delete a project secret
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
        - name: secretId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Secret deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecretDeleteResult"
        "404":
          description: Project or secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/secrets/{secretId}/reveal:
    post:
      operationId: revealProjectSecret
      tags: [secrets]
      summary: Reveal a project secret after an explicit user action
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
        - name: secretId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Explicitly revealed secret value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSecretRevealResult"
        "404":
          description: Project or secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/security-scan:
    post:
      operationId: scanProjectSecurity
      tags: [projects]
      summary: Scan a generated project for common security risks
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkspaceInput"
      responses:
        "200":
          description: Security scan report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityScanResult"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/shell:
    post:
      operationId: runProjectShell
      tags: [projects]
      summary: Run a safe project workspace command
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShellCommandInput"
      responses:
        "200":
          description: Shell command output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellCommandResult"
        "400":
          description: Unsupported command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateApplicationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 10000
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required:
        - prompt
    GeneratedApplication:
      type: object
      properties:
        html:
          type: string
      required:
        - html
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [username, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [id, username, email, firstName, lastName, profileImageUrl]
    AuthSession:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        authMethod:
          anyOf:
            - type: string
              enum: [password, replit]
            - type: "null"
      required: [user, authMethod]
    AuthLogout:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    Project:
      type: object
      properties:
        id:
          type: number
        workspaceId:
          type: string
        name:
          type: string
        prompt:
          type: string
        html:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - prompt
        - html
        - createdAt
        - updatedAt
    ProjectInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 10000
        html:
          type: ["string", "null"]
          maxLength: 2000000
      required:
        - workspaceId
        - name
    ProjectUpdate:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 10000
        html:
          type: ["string", "null"]
          maxLength: 2000000
      required:
        - workspaceId
    ProjectWorkspaceInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - workspaceId
    ProjectMessage:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - role
        - content
        - createdAt
    ProjectMemoryFile:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        name:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - name
        - content
        - createdAt
        - updatedAt
    ProjectChatInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 10000
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required:
        - workspaceId
        - message
    AttachmentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 6000000
        objectPath:
          type: string
          maxLength: 500
      required:
        - name
        - type
        - content
    ProjectChatResult:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        userMessage:
          $ref: "#/components/schemas/ProjectMessage"
        assistantMessage:
          $ref: "#/components/schemas/ProjectMessage"
        interaction:
          anyOf:
            - $ref: "#/components/schemas/ProjectInteraction"
            - type: "null"
      required:
        - project
        - userMessage
        - assistantMessage
        - interaction
    ProjectInteractionOption:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string
          minLength: 1
          maxLength: 500
      required: [id, label, value]
    ProjectInteraction:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        assistantMessageId:
          type: number
        kind:
          type: string
          enum: [question, proposal, secret]
        answerMode:
          type: string
          enum: [single_choice, multiple_choice, text, secret]
        prompt:
          type: string
        options:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/ProjectInteractionOption"
        secretName:
          type: ["string", "null"]
        status:
          type: string
          enum: [waiting, processing, answered, cancelled]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - assistantMessageId
        - kind
        - answerMode
        - prompt
        - options
        - secretName
        - status
        - createdAt
    PendingProjectInteractionResult:
      type: object
      properties:
        interaction:
          anyOf:
            - $ref: "#/components/schemas/ProjectInteraction"
            - type: "null"
      required: [interaction]
    ProjectInteractionResponseInput:
      type: object
      properties:
        choiceIds:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 64
        text:
          type: string
          maxLength: 4000
        secretValue:
          type: string
          minLength: 1
          maxLength: 10000
        confirmOverwrite:
          type: boolean
    ProjectInteractionCancelInput:
      type: object
      properties:
        reason:
          type: string
          maxLength: 1000
    CancelProjectInteractionResult:
      type: object
      properties:
        interaction:
          $ref: "#/components/schemas/ProjectInteraction"
        userMessage:
          $ref: "#/components/schemas/ProjectMessage"
      required: [interaction, userMessage]
    ProjectSecret:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, projectId, name, createdAt, updatedAt]
    ProjectSecretInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 10000
      required: [name, value]
    ProjectSecretUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 10000
    ProjectSecretRevealResult:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
      required: [name, value]
    ProjectSecretDeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    SecurityFinding:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        message:
          type: string
        line:
          type: number
        evidence:
          type: string
        remediation:
          type: string
      required: [id, severity, title, message, remediation]
    SecurityScanResult:
      type: object
      properties:
        scannedAt:
          type: string
          format: date-time
        score:
          type: number
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SecurityFinding"
        summary:
          type: object
          additionalProperties:
            type: number
      required: [scannedAt, score, findings, summary]
    ShellCommandInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        command:
          type: string
          minLength: 1
          maxLength: 500
      required: [workspaceId, command]
    ShellCommandResult:
      type: object
      properties:
        command:
          type: string
        output:
          type: string
        exitCode:
          type: number
        allowedCommands:
          type: array
          items:
            type: string
      required: [command, output, exitCode, allowedCommands]
    AdminAccess:
      type: object
      properties:
        isOwnerAdmin:
          type: boolean
        bootstrapAvailable:
          type: boolean
      required: [isOwnerAdmin, bootstrapAvailable]
    AdminBootstrapInput:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required: [token]
    AdminUsageUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        calls:
          type: number
        callSharePercent:
          type: number
        tokenCount:
          type: number
        tokenCallCount:
          type: number
        tokenSharePercent:
          type: number
      required: [id, username, createdAt, calls, callSharePercent, tokenCount, tokenCallCount, tokenSharePercent]
    AdminDashboard:
      type: object
      properties:
        period:
          type: string
          enum: [7d, 30d, 90d]
        totalUsers:
          type: number
        trackedCalls:
          type: number
        tokenReportedCalls:
          type: number
        reportedTokens:
          type: number
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUsageUser"
      required: [period, totalUsers, trackedCalls, tokenReportedCalls, reportedTokens, users]
    FeatureRelease:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        audience:
          type: string
          enum: [all, admin]
        defaultAudience:
          type: string
          enum: [all, admin]
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [key, label, audience, defaultAudience, updatedAt]
    FeatureReleaseInput:
      type: object
      properties:
        audience:
          type: string
          enum: [all, admin]
      required: [audience]
    FeatureReleaseList:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureRelease"
      required: [features]
    FeatureAccess:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
      required: [key, enabled]
    FeatureAccessList:
      type: object
      properties:
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureAccess"
      required: [features]
    AutoCodeUploadInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        contentType:
          type: string
          minLength: 1
          maxLength: 120
        size:
          type: number
          minimum: 1
          maximum: 10485760
      required: [name, contentType, size]
    AutoCodeUploadUrl:
      type: object
      properties:
        uploadId:
          type: number
        uploadUrl:
          type: string
      required: [uploadId, uploadUrl]
    AutoCodeProposalInput:
      type: object
      properties:
        message:
          type: string
          minLength: 3
          maxLength: 12000
        uploadIds:
          type: array
          maxItems: 5
          items:
            type: number
      required: [message]
    AutoCodeProposalSummary:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        status:
          type: string
          enum: [draft, pending_review, approved, rejected, applied]
        latestVersion:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, title, status, latestVersion, createdAt, updatedAt, submittedAt]
    AutoCodeProposalMessage:
      type: object
      properties:
        id:
          type: number
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, role, content, createdAt]
    AutoCodeProposalVersion:
      type: object
      properties:
        id:
          type: number
        version:
          type: number
        summary:
          type: string
        changedFiles:
          type: array
          items:
            type: string
        addedFiles:
          type: array
          items:
            type: string
        deletedFiles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required: [id, version, summary, changedFiles, addedFiles, deletedFiles, createdAt]
    AutoCodeProposalDetail:
      allOf:
        - $ref: "#/components/schemas/AutoCodeProposalSummary"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/AutoCodeProposalMessage"
            versions:
              type: array
              items:
                $ref: "#/components/schemas/AutoCodeProposalVersion"
          required: [messages, versions]
    AutoCodeProposalList:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AutoCodeProposalSummary"
      required: [proposals]
    AutoCodeAdminProposalSummary:
      allOf:
        - $ref: "#/components/schemas/AutoCodeProposalSummary"
        - type: object
          properties:
            ownerUsername:
              type: ["string", "null"]
          required: [ownerUsername]
    AutoCodeAdminProposalList:
      type: object
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/AutoCodeAdminProposalSummary"
      required: [proposals]
    AutoCodeProposalFile:
      type: object
      properties:
        path:
          type: string
        action:
          type: string
          enum: [context, added, modified, deleted]
      required: [path, action]
    AutoCodeProposalAttachment:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        contentType:
          type: string
        size:
          type: number
      required: [id, name, contentType, size]
    AutoCodeAdminProposalDetail:
      allOf:
        - $ref: "#/components/schemas/AutoCodeProposalDetail"
        - type: object
          properties:
            ownerUsername:
              type: ["string", "null"]
            files:
              type: array
              items:
                $ref: "#/components/schemas/AutoCodeProposalFile"
            notesMarkdown:
              type: string
            previewHtml:
              type: string
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AutoCodeProposalAttachment"
            reviewNote:
              type: ["string", "null"]
          required: [ownerUsername, files, notesMarkdown, previewHtml, attachments, reviewNote]
    AutoCodeFileContent:
      type: object
      properties:
        path:
          type: string
        action:
          type: string
          enum: [context, added, modified, deleted]
        content:
          type: string
        originalContent:
          type: ["string", "null"]
      required: [path, action, content, originalContent]
    AutoCodeFileInput:
      type: object
      properties:
        proposalId:
          type: number
          minimum: 1
        path:
          type: string
          minLength: 1
          maxLength: 500
      required: [proposalId, path]
    AutoCodeReviewInput:
      type: object
      properties:
        decision:
          type: string
          enum: [approve, reject, mark_applied]
        note:
          type: string
          maxLength: 4000
      required: [decision]
    AutoCodeReviewResult:
      type: object
      properties:
        proposal:
          $ref: "#/components/schemas/AutoCodeProposalSummary"
        reviewNote:
          type: ["string", "null"]
      required: [proposal, reviewNote]

