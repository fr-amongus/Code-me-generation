openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generation
    description: AI application generation operations
  - name: projects
    description: Saved project workspace operations
  - name: chat
    description: Project improvement conversations
  - name: auth
    description: Code Me account and session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateApplication
      tags: [generation]
      summary: Generate a standalone web application
      description: Generates a complete HTML/CSS/JavaScript application from a natural language description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateApplicationInput"
      responses:
        "200":
          description: Generated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApplication"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current signed-in account
      responses:
        "200":
          description: Current account or null when signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Register a Code Me account with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Username already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/login:
    post:
      operationId: loginWithPassword
      tags: [auth]
      summary: Sign in with a Code Me username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid login input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Username or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Sign out of a Code Me account
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogout"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List saved projects for a workspace
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "400":
          description: Invalid workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a saved project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a saved project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a saved project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkspaceInput"
      responses:
        "204":
          description: Project deleted
        "400":
          description: Invalid workspace or project id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/messages:
    get:
      operationId: listProjectMessages
      tags: [chat]
      summary: List the saved messages for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Project conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMessage"
        "400":
          description: Invalid project or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/memory:
    get:
      operationId: listProjectMemoryFiles
      tags: [projects]
      summary: List the persistent memory files for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      responses:
        "200":
          description: Project memory files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMemoryFile"
        "400":
          description: Invalid project or workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/chat:
    post:
      operationId: sendProjectMessage
      tags: [chat]
      summary: Improve a project through a saved chat message
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectChatInput"
      responses:
        "200":
          description: Updated project and saved conversation messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectChatResult"
        "400":
          description: Invalid project message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Chat generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/security-scan:
    post:
      operationId: scanProjectSecurity
      tags: [projects]
      summary: Scan a generated project for common security risks
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectWorkspaceInput"
      responses:
        "200":
          description: Security scan report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityScanResult"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /projects/{projectId}/shell:
    post:
      operationId: runProjectShell
      tags: [projects]
      summary: Run a safe project workspace command
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShellCommandInput"
      responses:
        "200":
          description: Shell command output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShellCommandResult"
        "400":
          description: Unsupported command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateApplicationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 10000
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required:
        - prompt
    GeneratedApplication:
      type: object
      properties:
        html:
          type: string
      required:
        - html
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthCredentials:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        password:
          type: string
          minLength: 8
          maxLength: 128
      required: [username, password]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [id, username, email, firstName, lastName, profileImageUrl]
    AuthSession:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        authMethod:
          anyOf:
            - type: string
              enum: [password, replit]
            - type: "null"
      required: [user, authMethod]
    AuthLogout:
      type: object
      properties:
        success:
          type: boolean
      required: [success]
    Project:
      type: object
      properties:
        id:
          type: number
        workspaceId:
          type: string
        name:
          type: string
        prompt:
          type: string
        html:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - workspaceId
        - name
        - prompt
        - html
        - createdAt
        - updatedAt
    ProjectInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 10000
        html:
          type: ["string", "null"]
          maxLength: 2000000
      required:
        - workspaceId
        - name
    ProjectUpdate:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          maxLength: 10000
        html:
          type: ["string", "null"]
          maxLength: 2000000
      required:
        - workspaceId
    ProjectWorkspaceInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - workspaceId
    ProjectMessage:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - role
        - content
        - createdAt
    ProjectMemoryFile:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        name:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - projectId
        - name
        - content
        - createdAt
        - updatedAt
    ProjectChatInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        message:
          type: string
          minLength: 1
          maxLength: 10000
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AttachmentInput"
      required:
        - workspaceId
        - message
    AttachmentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          maxLength: 120
        content:
          type: string
          maxLength: 6000000
        objectPath:
          type: string
          maxLength: 500
      required:
        - name
        - type
        - content
    ProjectChatResult:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        userMessage:
          $ref: "#/components/schemas/ProjectMessage"
        assistantMessage:
          $ref: "#/components/schemas/ProjectMessage"
      required:
        - project
        - userMessage
        - assistantMessage
    SecurityFinding:
      type: object
      properties:
        id:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        title:
          type: string
        message:
          type: string
        line:
          type: number
        evidence:
          type: string
        remediation:
          type: string
      required: [id, severity, title, message, remediation]
    SecurityScanResult:
      type: object
      properties:
        scannedAt:
          type: string
          format: date-time
        score:
          type: number
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SecurityFinding"
        summary:
          type: object
          additionalProperties:
            type: number
      required: [scannedAt, score, findings, summary]
    ShellCommandInput:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 8
          maxLength: 128
        command:
          type: string
          minLength: 1
          maxLength: 500
      required: [workspaceId, command]
    ShellCommandResult:
      type: object
      properties:
        command:
          type: string
        output:
          type: string
        exitCode:
          type: number
        allowedCommands:
          type: array
          items:
            type: string
      required: [command, output, exitCode, allowedCommands]

