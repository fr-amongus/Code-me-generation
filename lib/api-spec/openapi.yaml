openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generation
    description: AI application generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateApplication
      tags: [generation]
      summary: Generate a standalone web application
      description: Generates a complete HTML/CSS/JavaScript application from a natural language description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateApplicationInput"
      responses:
        "200":
          description: Generated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedApplication"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Generation service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateApplicationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 10000
      required:
        - prompt
    GeneratedApplication:
      type: object
      properties:
        html:
          type: string
      required:
        - html
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

