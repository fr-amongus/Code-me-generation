kind = "web"
previewPath = "/"
title = "Code Me Generation"
description = "Un générateur d'applications web propulsé par Gemini qui transforme une idée décrite en langage naturel en une application autonome visible instantanément dans un aperçu live."
version = "1.0.0"
id = "artifacts/code-me-generation"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19457

[services.development]
run = "pnpm --filter @workspace/code-me-generation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/code-me-generation", "run", "build" ]
serve = "static"
publicDir = "artifacts/code-me-generation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19457"
BASE_PATH = "/"
